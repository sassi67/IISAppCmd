name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build main project
        run: msbuild IISAppCmd/IISAppCmd.csproj /p:Configuration=Release /restore

      - name: Run tests
        run: dotnet test IISAppCmd/test/IISAppCmd.Tests.csproj --configuration Release
